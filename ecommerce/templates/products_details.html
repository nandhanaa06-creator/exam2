{% extends 'base.html' %}
{%block content %}
  

    <div class="container">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
        <img src="#" alt="No Image">
        {% endif %}

        <div class="info">
            <h1>{{ product.name }}</h1>
            <h3>₹{{ product.price }}</h3>
            <p>{{ product.description }}</p>

            <button><a href="{% url 'cart_add' product.id %}">Add to Cart</a>
</button>
        </div>
    </div>


{%endblock%}
