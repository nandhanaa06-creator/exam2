{% extends 'base.html' %}
{% block content %}

<style>
    .profile-box {
        width: 60%;
        margin: 40px auto;
        background: white;
        padding: 25px 35px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .profile-header img {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        background: #eee;
    }

    .profile-header h2 {
        margin: 0;
        font-size: 26px;
    }

    .profile-info p {
        font-size: 16px;
        margin: 8px 0;
    }

    .btns {
        margin-top: 25px;
        display: flex;
        gap: 15px;
    }

    .btn {
        background: black;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 16px;
    }

    .btn:hover {
        background: #333;
    }

    .logout-btn {
        background: crimson;
    }

    .logout-btn:hover {
        background: rgb(175, 0, 30);
    }
</style>

<div class="profile-box">

    <div class="profile-header">
        <img src="https://via.placeholder.com/100" alt="User">
        <div>
            <h2>{{ request.user.username }}</h2>
            <small>Joined: {{ request.user.date_joined|date:"M d, Y" }}</small>
        </div>
    </div>

    <div class="profile-info">
        <p><strong>Email:</strong> {{ request.user.email }}</p>
        <p><strong>Last Login:</strong> {{ request.user.last_login|date:"M d, Y H:i" }}</p>
    </div>

    <div class="btns">
    <a href="{% url 'edit_profile' %}" class="btn">Edit Profile</a>
    <a href="{% url 'logout' %}" class="btn logout-btn">Logout</a>
</div>


</div>

{% endblock %}
