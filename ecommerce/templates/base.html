        .dropdown {
    position: relative;
    display: inline-block;
}

.dropbtn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: #333;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #fff;
    min-width: 150px;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    z-index: 1;
    border-radius: 5px;
}

.dropdown-content a {
    color: #333;
    padding: 10px 15px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f2f2f2;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropdown:hover .dropbtn {
    color: #000;

    h2 {
        margin-bottom: 20px;
        font-size: 28px;
    }

    .grid {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: flex-start;
    }

    .card {
        width: 220px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        background: white;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: transform 0.2s ease-in-out;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 10px;
    }

    .card h3 {
        margin: 10px 0;
        font-size: 18px;
    }

    .card a {
        color: #7744dd;
        text-decoration: none;
        font-weight: 600;
    }

    .card a:hover {
        text-decoration: underline;
    }

    .checkout-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-top: 40px;
    }

    .checkout-box {
        width: 80%;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }

    .checkout-title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .checkout-grid {
        display: flex;
        gap: 35px;
        align-items: flex-start;
    }

    /* LEFT SIDE */
    .checkout-left {
        flex: 2;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        font-size: 16px;
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #bbb;
        font-size: 15px;
        background: #fafafa;
    }

    input:focus, textarea:focus {
        border-color: black;
        outline: none;
        background: #fff;
    }

    .btn-order {
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: black;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-order:hover {
        background: #333;
    }

    /* RIGHT SIDE SUMMARY */
    .checkout-right {
        flex: 1;
        background: #f8f8f8;
        padding: 20px;

        border: 1px solid #e0e0e0;

    .checkout-right h3 {

    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 17px;
        font-weight: 500;
