{% extends 'admin_base.html' %}
{% block admin_content %}

<style>
/* MATCH PRODUCT PAGE WIDTH */
.page-wrapper {
    width: 95%;
    max-width: 1350px;
    margin: auto;
    padding-top: 10px;
}

/* HEADER ALIGNMENT LIKE PRODUCT PAGE */
.header-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

/* CENTERED HEADING EXACT SAME STYLE */
.header-section h2 {
    flex-grow: 1;
    text-align: center;
    font-weight: 700;
    font-size: 32px;
    margin: 0;
}

/* SMALL ADD BUTTON – SAME STYLE AS PRODUCT PAGE */
.add-btn {
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
    white-space: nowrap;
}

/* TABLE CARD – SAME STYLE */
.table-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    overflow-x: auto;
}

/* TABLE STYLES IDENTICAL */
.table {
    width: 100%;
    min-width: 900px;
    text-align: center;
}

.table thead {
    background: #333333;
    color: white;
    height: 55px;
}

.table th, .table td {
    padding: 15px;
    vertical-align: middle;
}

/* BANNER IMAGE SIZE */
.banner-img {
    width: 160px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
}

/* HOVER ROW EFFECT */
.table tbody tr {
    transition: background 0.25s;
}

.table tbody tr:hover {
    background: #f5f5f5;
}
</style>



<!-- ========================= -->
<!-- HEADER + ADD BUTTON      -->
<!-- ========================= -->

<div class="page-wrapper">

    <div class="header-section">

        <h2>All Banners</h2>

        <a class="add-btn"
           data-bs-toggle="modal"
           data-bs-target="#addBannerModal">
           + Add Banner
        </a>

    </div>



    <!-- ========================= -->
    <!-- TABLE SECTION            -->
    <!-- ========================= -->

    <div class="table-card">
        <table class="table table-hover">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Banner</th>
                    <th>Uploaded</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for b in banners %}
                <tr>
                    <td>{{ b.id }}</td>

                    <td>
                        <img src="{{ b.image.url }}" class="banner-img">
                    </td>

                    <td style="font-weight:600;">
                        {{ b.created_at|date:"d M Y" }}
                    </td>

                    <td>
                        <a href="{% url 'delete_banner' b.id %}"
                           class="btn btn-danger btn-sm"
                           style="padding:7px 14px;">
                           Delete
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-muted text-center">
                        No banners uploaded yet.
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>




<!-- ========================= -->
<!-- ADD BANNER MODAL         -->
<!-- ========================= -->

<div class="modal fade" id="addBannerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:450px;">
    <div class="modal-content" style="border-radius:12px;">

      <div style="background:#007bff; color:white; padding:12px 20px; 
                  border-radius:12px 12px 0 0; 
                  display:flex; justify-content:space-between; align-items:center;">
        <h5 class="modal-title">Upload New Banner</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form action="{% url 'add_banner' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="modal-body">
          <label style="font-weight:600;">Choose Banner Image</label>
          <input type="file" name="image" class="form-control" required>
        </div>

        <div class="modal-footer">
            <button class="btn btn-primary w-100">Upload</button>
        </div>
      </form>

    </div>
  </div>
</div>

{% endblock %}
