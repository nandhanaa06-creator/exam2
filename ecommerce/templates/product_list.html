{% extends 'base.html' %}
{% block content %}

    <div class="container">
        <h1>Products</h1>

        <div class="grid">
            {% for product in products %}
            <div class="card">

                {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                <img src="#" alt="No Image">
                {% endif %}

                <h3>{{ product.name }}</h3>
                <p>₹{{ product.price }}</p>
                <a href="{% url 'product_detail' product.id %}">View</a>


            </div>
            {% empty %}
            <p>No products available</p>
            {% endfor %}
        </div>
    </div>

{%endblock%}
